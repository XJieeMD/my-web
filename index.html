<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#6b7385;--key:#eef0f6;--op:#4f46e5;--opx:#fff;--eq:#16a34a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef5;--mut:#9aa2b5;--key:#2a2e3f;--op:#818cf8;--opx:#12141c;--eq:#4ade80}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eceef5;--mut:#9aa2b5;--key:#2a2e3f;--op:#818cf8;--opx:#12141c;--eq:#4ade80}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.scr{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:14px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end}
#his{color:var(--mut);font-size:.85rem;min-height:1.3em;overflow:hidden;white-space:nowrap}
#out{font-size:2.2rem;font-weight:600;overflow-x:auto;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:1.25rem;border:0;border-radius:14px;height:60px;background:var(--key);color:var(--tx);cursor:pointer}
button:active{transform:scale(.96)}
button.o{background:var(--op);color:var(--opx)}
button.e{background:var(--eq);color:#fff}
button.w{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
<div class="scr"><div id="his"></div><div id="out">0</div></div>
<div class="pad">
<button data-a="C" class="o">C</button><button data-a="del" class="o">⌫</button><button data-a="%" class="o">%</button><button data-o="÷" class="o">÷</button>
<button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-o="×" class="o">×</button>
<button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-o="−" class="o">−</button>
<button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-o="+" class="o">+</button>
<button data-a="neg">±</button><button data-n="0">0</button><button data-n=".">.</button><button data-a="=" class="e">=</button>
</div>
</div>
<script>
var cur='0',prev=null,op=null,fresh=false,err=false;
/* Hasil lucu-lucuan: tulis "angka1+operator+angka2": "teks yang muncul". Operator: + − × ÷ */
var EGGS={'1+1':'Hello World','2+1':'BEGO LU!'};
var out=document.getElementById('out'),his=document.getElementById('his');
function fmt(s){if(err)return s;var p=String(s).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return p.join(',')}
function show(){out.textContent=fmt(cur);his.textContent=(prev!==null&&op)?fmt(prev)+' '+op:''}
function calc(a,b,o){
 a=parseFloat(a);b=parseFloat(b);var r;
 if(o=='+')r=a+b;else if(o=='−')r=a-b;else if(o=='×')r=a*b;else{if(b===0){err=true;return 'Tidak bisa dibagi 0'}r=a/b}
 return String(parseFloat(r.toPrecision(12)))}
function num(d){
 if(err)reset();
 if(fresh){cur='0';fresh=false}
 if(d=='.'){if(cur.indexOf('.')<0)cur+='.'}
 else cur=(cur=='0')?d:(cur.length<15?cur+d:cur);
 show()}
function oper(o){
 if(err)return;
 if(op&&!fresh){cur=calc(prev,cur,op);if(err){show();return}}
 prev=cur;op=o;fresh=true;show()}
function eq(){
 if(err||!op||prev===null)return;
 var h=fmt(prev)+' '+op+' '+fmt(cur)+' =';
 var egg=EGGS[parseFloat(prev)+op+parseFloat(cur)];
 if(egg){cur=egg;err=true;prev=null;op=null;show();his.textContent=h;return}
 cur=calc(prev,cur,op);prev=null;op=null;fresh=true;show();his.textContent=h}
function reset(){cur='0';prev=null;op=null;fresh=false;err=false;show()}
function act(a){
 if(a=='C')reset();
 else if(err)return;
 else if(a=='del'){if(fresh)return;cur=cur.length>1&&!(cur.length==2&&cur[0]=='-')?cur.slice(0,-1):'0';show()}
 else if(a=='neg'){if(cur!='0'){cur=cur[0]=='-'?cur.slice(1):'-'+cur;show()}}
 else if(a=='%'){cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));show()}
 else if(a=='=')eq()}
document.querySelector('.pad').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.n!==undefined)num(b.dataset.n);
 else if(b.dataset.o)oper(b.dataset.o);
 else act(b.dataset.a)});
document.addEventListener('keydown',function(e){
 var k=e.key,m={'*':'×','/':'÷','-':'−','+':'+'};
 if(/^[0-9.]$/.test(k))num(k);
 else if(m[k]){e.preventDefault();oper(m[k])}
 else if(k==','){num('.')}
 else if(k=='Enter'||k=='='){e.preventDefault();act('=')}
 else if(k=='Backspace')act('del');
 else if(k=='Escape'||k=='Delete')act('C');
 else if(k=='%')act('%')});
show();
</script>
</body>
</html>
